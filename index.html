<!doctype html>
<!-- The browser starts here; React later fills the element with id="root". -->
<html lang="en">
  <head>
    <!-- Declare the document's character encoding so text displays correctly. -->
    <meta charset="UTF-8" />
    <!-- Use the site's SVG icon in browser tabs and bookmarks. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Match the page width to the device width for responsive layouts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Text shown in the browser tab. -->
    <title>real-assist</title>
  </head>
  <body>
    <!-- React mounts the interactive application into this empty element. -->
    <div id="root"></div>
    <!-- Load the JavaScript entry point as a browser module. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
